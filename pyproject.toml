[project]
name = "poltergeist"
version = "0.1.0"
description = "Find the characters you cannot see, and ask a local open-weight model about the bugs they cause."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.scripts]
poltergeist = "poltergeist.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["poltergeist"]
